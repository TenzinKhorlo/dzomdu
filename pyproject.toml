[project]
name = "dzomdu"
version = "0.1.0"
description = "Offline meeting notetaker: speaker recognition, speaker-attributed transcription and local-LLM minutes, saved as Markdown."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    # local web UI
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Apple Silicon speech-to-text (Parakeet + Whisper on MLX)
mac = ["parakeet-mlx>=0.5", "mlx-whisper>=0.4"]
# Speaker diarization + voiceprints (pyannote community-1)
diarize = ["pyannote.audio>=4.0"]
# Whisper on CPU / CUDA (Linux, or as a fallback)
whisper = ["faster-whisper>=1.1"]
# Faster optimal speaker mapping in the benchmark DER metric
bench = ["scipy>=1.11"]

[project.scripts]
dzomdu = "dzomdu.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dzomdu"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
